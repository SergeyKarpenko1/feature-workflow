# Copy to <your project>/.feature/config.toml (the /feature skill writes it for you on first run).

language = "en"             # language of the task card
agent = "claude"
base_branch = "main"        # diffs and the scope check are taken against this branch
features_dir = "docs/features"

[tracker]
kind = "none"               # free name (jira, linear, github...) or "none"
task_card = false           # true: print a title + description for the tracker after Enrich

[checks]                    # run by the code gate, in this order, from the project root
commands = ["pytest -q"]    # any shell commands; all must exit 0
known_failures = ""         # optional file with pytest lines "FAILED path::test" that are tolerated
timeout_sec = 600

[triage]                    # when does a feature need the full cycle instead of the short one
max_short_files = 3
rules = [
  { reason = "touches a contract (migrations, public schema)", pattern = "^migrations/|schema" },
]
